<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtriaTrade Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">AtriaTrade</h1>
                <p class="text-sm text-gray-400 mt-1">Dashboard</p>
            </div>
            <div class="bg-green-900 text-green-300 px-4 py-2 rounded-lg text-sm font-bold border border-green-700">🟢 {{ status }}</div>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <h2 class="text-xl mb-3 border-b border-gray-600 pb-2">وضعیت سیستم</h2>
                <p id="health-status" class="text-gray-400">در حال اتصال...</p>
            </div>
        </div>
    </div>
    <script>
        fetch('/health').then(res => res.json()).then(data => {
            document.getElementById('health-status').innerHTML = `وضعیت API: <span class="text-green-400">متصل</span><br>حالت: ${data.mode}`;
        }).catch(() => {
            document.getElementById('health-status').innerHTML = '<span class="text-red-500">خطا در ارتباط</span>';
        });
    </script>
</body>
</html>
