<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtriaTrade Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-base: #0b0f19; --bg-card: rgba(18, 26, 43, 0.85); --border-color: rgba(255, 255, 255, 0.08); --text-primary: #f8fafc; --text-secondary: #94a3b8; --accent-blue: #3b82f6; --accent-green: #10b981; --accent-red: #ef4444; }
        body { background-color: var(--bg-base); color: var(--text-primary); min-height: 100vh; padding: 16px; font-family: sans-serif; }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-red); }
        .pulse-dot.running { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .btn { cursor: pointer; padding: 8px 16px; border-radius: 10px; border: none; font-weight: 700; }
        .btn-start { background: var(--accent-green); color: white; }
        .btn-panic { background: var(--accent-red); color: white; }
        .logs-window { height: 300px; background: #060911; border-radius: 10px; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="glass-card header">
            <div><h1>AtriaTrade Pro</h1></div>
            <div class="header-actions">
                <span id="statusText">اتصال...</span> <div id="statusDot" class="pulse-dot"></div>
                <button class="btn btn-start" onclick="controlBot('start')">شروع</button>
                <button class="btn btn-panic" onclick="controlBot('stop')">توقف اضطراری</button>
            </div>
        </header>

        <section style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px;">
            <div class="glass-card">
                <h3>موجودی: <span id="valBalance">0</span> USDT</h3>
                <h3 id="valPnl">سود: 0</h3>
            </div>
            <div class="glass-card">
                <h3>📜 لاگ‌های زنده</h3>
                <div class="logs-window" id="logsContainer"></div>
            </div>
        </section>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('valBalance').innerText = data.balance || "0";
                document.getElementById('valPnl').innerText = data.pnl || "0";
                document.getElementById('statusText').innerText = data.is_running ? "فعال" : "متوقف";
                document.getElementById('statusDot').className = 'pulse-dot ' + (data.is_running ? 'running' : '');
                
                const logsContainer = document.getElementById('logsContainer');
                logsContainer.innerHTML = data.logs.map(l => `<div>${l}</div>`).join('');
                logsContainer.scrollTop = logsContainer.scrollHeight;
            } catch (err) { console.error("Update failed:", err); }
        }

        async function controlBot(action) {
            await fetch(`/api/bot/${action}`, { method: 'POST' });
            updateDashboard();
        }

        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
