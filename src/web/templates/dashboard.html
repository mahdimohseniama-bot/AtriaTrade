<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtriaTrade Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; }
        .cyber-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    </style>
</head>
<body class="p-4 md:p-6">

    <!-- Header Status -->
    <div class="cyber-card p-4 mb-6 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div id="status-indicator" class="w-4 h-4 rounded-full bg-yellow-500 animate-pulse"></div>
            <h1 class="text-xl font-bold text-white">داشبورد پیشرفته AtriaTrade Pro</h1>
            <span id="connection-text" class="text-sm text-gray-400">(در حال اتصال...)</span>
        </div>
        <div class="flex gap-3">
            <button onclick="sendAction('toggle_autopilot')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">سوییچ اتوپایلوت</button>
            <button onclick="sendAction('panic')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition animate-bounce">🚨 وضعیت اضطراری (PANIC)</button>
        </div>
    </div>

    <!-- Top Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="cyber-card p-4">
            <div class="text-gray-400 text-sm">قیمت بیت‌کوین (BTC)</div>
            <div id="btc-price" class="text-2xl font-extrabold text-green-400 mt-1">$-.--</div>
        </div>
        <div class="cyber-card p-4">
            <div class="text-gray-400 text-sm">کل سرمایه (Equity)</div>
            <div id="total-equity" class="text-2xl font-extrabold text-blue-400 mt-1">$-.--</div>
        </div>
        <div class="cyber-card p-4">
            <div class="text-gray-400 text-sm">رزرو سود امن (USDT)</div>
            <div id="reserve-usdt" class="text-2xl font-extrabold text-purple-400 mt-1">$-.--</div>
        </div>
        <div class="cyber-card p-4">
            <div class="text-gray-400 text-sm">وین‌ریت استراتژی</div>
            <div id="win-rate" class="text-2xl font-extrabold text-yellow-400 mt-1">--%</div>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- Live Chart -->
        <div class="cyber-card p-4 lg:col-span-2">
            <h2 class="text-lg font-bold text-white mb-4">نمودار زنده BTC/USDT</h2>
            <div class="relative h-64">
                <canvas id="liveChart"></canvas>
            </div>
        </div>

        <!-- Controls & Position -->
        <div class="cyber-card p-4 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-white mb-4">پوزیشن فعال</h2>
                <div id="position-info" class="text-sm space-y-2 text-gray-300">
                    <div>وضعیت: <span class="font-bold text-gray-400">بدون پوزیشن</span></div>
                </div>
            </div>

            <div class="mt-6 border-t border-gray-700 pt-4">
                <h3 class="text-sm font-bold text-gray-300 mb-3">دستورات دستی</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="sendAction('buy')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-bold">خرید (Long)</button>
                    <button onclick="sendAction('sell')" class="bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg font-bold">فروش (Short)</button>
                </div>
                <button onclick="sendAction('close')" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg font-bold mt-2">بستن پوزیشن</button>
            </div>
        </div>
    </div>

    <!-- Logs Box -->
    <div class="cyber-card p-4">
        <h2 class="text-lg font-bold text-white mb-3">کنسول لاگ‌های زنده سیستم</h2>
        <div id="logs-container" class="bg-black/50 p-3 rounded-lg font-mono text-xs text-green-400 h-40 overflow-y-auto space-y-1">
            <div>در حال دریافت لاگ‌ها...</div>
        </div>
    </div>

    <script>
        // Token Management
        const getAuthToken = () => localStorage.getItem('X-Auth-Token') || 'atria_auth_token_secret_402139235';
        
        const getHeaders = () => ({
            'Content-Type': 'application/json',
            'X-Auth-Token': getAuthToken()
        });

        // Init Chart
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'قیمت BTC',
                    data: [],
                    borderColor: '#10b981',
                    borderWidth: 2,
                    tension: 0.2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#6b7280' } },
                    y: { ticks: { color: '#6b7280' } }
                }
            }
        });

        // Telemetry Poller
        async function fetchTelemetry() {
            try {
                const res = await fetch('/api/telemetry', { headers: getHeaders() });
                if (!res.ok) throw new Error('Auth or Server error');
                const data = await res.json();

                // Status Update
                document.getElementById('status-indicator').className = 'w-4 h-4 rounded-full bg-green-500';
                document.getElementById('connection-text').innerText = '(متصل - آنلاین)';
                document.getElementById('connection-text').className = 'text-sm text-green-400';

                // Stats Update
                document.getElementById('btc-price').innerText = '$' + Number(data.btc_price).toLocaleString();
                document.getElementById('total-equity').innerText = '$' + Number(data.total_equity).toLocaleString();
                document.getElementById('reserve-usdt').innerText = '$' + Number(data.reserve_usdt).toLocaleString();
                document.getElementById('win-rate').innerText = data.win_rate + '%';

                // Chart Update
                const now = new Date().toLocaleTimeString('fa-IR');
                if (chart.data.labels.length > 20) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                }
                chart.data.labels.push(now);
                chart.data.datasets[0].data.push(data.btc_price);
                chart.update();

                // Position Update
                const posBox = document.getElementById('position-info');
                if (data.position) {
                    posBox.innerHTML = `
                        <div class="flex justify-between"><span>جهت:</span><span class="font-bold ${data.position.side==='LONG'?'text-green-400':'text-red-400'}">${data.position.side}</span></div>
                        <div class="flex justify-between"><span>حجم:</span><span>${data.position.amount} BTC</span></div>
                        <div class="flex justify-between"><span>ورود:</span><span>$${data.position.entry_price}</span></div>
                        <div class="flex justify-between"><span>سود/زیان:</span><span class="text-green-400 font-bold">+$${data.position.pnl}</span></div>
                    `;
                } else {
                    posBox.innerHTML = `<div class="text-gray-500">پوزیشن فعالی وجود ندارد.</div>`;
                }

                // Logs Update
                if (data.logs) {
                    const logsBox = document.getElementById('logs-container');
                    logsBox.innerHTML = data.logs.map(l => `<div>${l}</div>`).join('');
                    logsBox.scrollTop = logsBox.scrollHeight;
                }

            } catch (err) {
                document.getElementById('status-indicator').className = 'w-4 h-4 rounded-full bg-red-500';
                document.getElementById('connection-text').innerText = '(خطا در ارتباط!)';
                document.getElementById('connection-text').className = 'text-sm text-red-400';
            }
        }

        // Action Trigger
        async function sendAction(actionName) {
            try {
                await fetch('/api/action', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ action: actionName, amount: 0.02 })
                });
                fetchTelemetry();
            } catch (err) {
                alert('خطا در ارسال دستور!');
            }
        }

        // Auto Poll every 1.8s
        setInterval(fetchTelemetry, 1800);
        fetchTelemetry();
    </script>
</body>
</html>
