<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtriaTrade Pro - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(23, 28, 40, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .ltr { direction: ltr; display: inline-block; }
    </style>
</head>
<body class="bg-[#0b0e14] text-gray-200 min-h-screen p-3 space-y-3 pb-8">

    <!-- Header -->
    <header class="glass rounded-xl p-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2 space-x-reverse">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="text-sm sm:text-base font-black tracking-wider text-white">ATRIATRADE <span class="text-xs text-emerald-400 font-mono">AUTO-PILOT</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="sendAction('toggle_auto')" id="autoBtn" class="px-2.5 py-1 text-xs rounded-lg font-bold bg-emerald-600 text-white flex items-center gap-1 shadow">
                <i class="fas fa-robot"></i> <span id="autoText">اتوپایلوت: فعال</span>
            </button>
            <button onclick="sendAction('panic')" class="px-2.5 py-1 text-xs rounded-lg font-bold bg-rose-600 text-white flex items-center gap-1 shadow animate-pulse">
                <i class="fas fa-exclamation-triangle"></i> PANIC
            </button>
        </div>
    </header>

    <!-- Top Metrics Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <div class="glass p-2.5 rounded-xl border-r-4 border-emerald-500">
            <p class="text-[11px] text-gray-400">قیمت BTC/USDT</p>
            <h2 id="btcPrice" class="text-base font-black text-emerald-400 font-mono mt-0.5 ltr">$0.00</h2>
        </div>
        <div class="glass p-2.5 rounded-xl border-r-4 border-cyan-500">
            <p class="text-[11px] text-gray-400">کل سرمایه (Equity)</p>
            <h2 id="totalEquity" class="text-base font-black text-cyan-400 font-mono mt-0.5 ltr">$0.00</h2>
        </div>
        <div class="glass p-2.5 rounded-xl border-r-4 border-amber-500">
            <p class="text-[11px] text-gray-400">صندوق امن ذخیره سود</p>
            <h2 id="reserveVault" class="text-base font-black text-amber-400 font-mono mt-0.5 ltr">$0.00</h2>
        </div>
        <div class="glass p-2.5 rounded-xl border-r-4 border-purple-500">
            <p class="text-[11px] text-gray-400">سود کل محقق شده</p>
            <h2 id="totalProfit" class="text-base font-black text-purple-400 font-mono mt-0.5 ltr">+0.00 USDT</h2>
        </div>
    </div>

    <!-- Live Price Chart -->
    <div class="glass p-3 rounded-xl">
        <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <i class="fas fa-chart-line text-emerald-400 text-xs"></i>
                <span class="text-xs font-bold text-gray-300">نمودار زنده قیمت BTC</span>
            </div>
            <span id="chartTrendBadge" class="text-[11px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 font-mono border border-emerald-800">LIVE</span>
        </div>
        <div class="h-36 sm:h-44 w-full">
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <!-- AI Strategy & Position Banner -->
    <div class="glass p-3 rounded-xl flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-4">
            <div>
                <span class="text-[11px] text-gray-400 block">شاخص RSI (14)</span>
                <span id="rsiVal" class="font-mono text-sm font-bold text-yellow-400">50.0</span>
            </div>
            <div>
                <span class="text-[11px] text-gray-400 block">روند مارکت</span>
                <span id="marketTrend" class="text-xs font-bold text-gray-300">در حال تحلیل...</span>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-gray-900/60 px-3 py-1.5 rounded-lg border border-gray-700/50">
            <span class="text-xs text-gray-400">پوزیشن فعال:</span>
            <span id="activePos" class="font-mono text-xs font-bold text-gray-200">FLAT</span>
            <span id="posPnl" class="font-mono text-xs font-bold ltr"></span>
        </div>
    </div>

    <!-- Manual Quick Order Controls -->
    <div class="glass p-3 rounded-xl flex gap-2">
        <button onclick="sendAction('buy')" class="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-bold text-xs flex justify-center items-center gap-1 shadow">
            <i class="fas fa-arrow-up"></i> خرید دستی 0.02 BTC
        </button>
        <button onclick="sendAction('sell')" class="flex-1 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 font-bold text-xs flex justify-center items-center gap-1 shadow">
            <i class="fas fa-arrow-down"></i> فروش دستی 0.02 BTC
        </button>
    </div>

    <!-- Recent Trades & Terminal Logs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- Trades History -->
        <div class="glass p-3 rounded-xl flex flex-col">
            <div class="flex items-center gap-1.5 text-xs text-gray-400 mb-2">
                <i class="fas fa-history text-cyan-400"></i> معاملات اخیر ربات
            </div>
            <div id="tradesList" class="space-y-1.5 text-xs font-mono max-h-36 overflow-y-auto">
                <div class="text-gray-500 text-[11px]">هنوز معامله‌ای بسته نشده است.</div>
            </div>
        </div>

        <!-- System Logs -->
        <div class="glass p-3 rounded-xl flex flex-col">
            <div class="flex items-center gap-1.5 text-xs text-gray-400 mb-2">
                <i class="fas fa-terminal text-emerald-400"></i> گزارش زنده سیستم
            </div>
            <div id="logConsole" class="space-y-1 text-xs font-mono max-h-36 overflow-y-auto text-gray-300">
            </div>
        </div>
    </div>

    <script>
        // Chart Initialization
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chartData = {
            labels: [],
            datasets: [{
                label: 'BTC Price',
                data: [],
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.35,
                pointRadius: 2
            }]
        };
        const priceChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#9ca3af', font: { size: 10 } }
                    }
                }
            }
        });

        async function fetchTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                const data = await res.json();
                
                document.getElementById('btcPrice').innerText = '$' + data.btc_price;
                document.getElementById('totalEquity').innerText = '$' + data.total_equity;
                document.getElementById('reserveVault').innerText = '$' + data.reserve_usdt;
                document.getElementById('totalProfit').innerText = data.total_profit_usdt + ' USDT';
                document.getElementById('rsiVal').innerText = data.rsi;
                document.getElementById('marketTrend').innerText = data.trend;
                
                // Update Live Chart
                const rawPrice = parseFloat(data.btc_price.replace(/,/g, ''));
                const nowTime = new Date().toLocaleTimeString('fa-IR');
                if (priceChart.data.labels.length > 20) {
                    priceChart.data.labels.shift();
                    priceChart.data.datasets[0].data.shift();
                }
                priceChart.data.labels.push(nowTime);
                priceChart.data.datasets[0].data.push(rawPrice);
                priceChart.update();

                // Auto Pilot Button UI
                const autoBtn = document.getElementById('autoBtn');
                const autoText = document.getElementById('autoText');
                if (data.auto_pilot) {
                    autoBtn.className = "px-2.5 py-1 text-xs rounded-lg font-bold bg-emerald-600 text-white flex items-center gap-1 shadow";
                    autoText.innerText = "اتوپایلوت: فعال";
                } else {
                    autoBtn.className = "px-2.5 py-1 text-xs rounded-lg font-bold bg-gray-600 text-white flex items-center gap-1 shadow";
                    autoText.innerText = "اتوپایلوت: خاموش";
                }

                // Position Display
                const pos = data.position;
                const posElem = document.getElementById('activePos');
                const pnlElem = document.getElementById('posPnl');
                if (pos.side !== 'FLAT') {
                    posElem.innerText = `${pos.side} (${pos.amount} BTC @ ${pos.entry_price})`;
                    pnlElem.innerText = `[PnL: ${pos.pnl > 0 ? '+' : ''}${pos.pnl} USDT]`;
                    pnlElem.className = pos.pnl >= 0 ? "font-mono text-xs font-bold text-emerald-400 ltr" : "font-mono text-xs font-bold text-rose-400 ltr";
                } else {
                    posElem.innerText = "FLAT (بدون پوزیشن)";
                    pnlElem.innerText = "";
                }

                // Recent Trades
                const tradesDiv = document.getElementById('tradesList');
                if (data.recent_trades.length > 0) {
                    tradesDiv.innerHTML = data.recent_trades.map(t => `
                        <div class="flex justify-between items-center bg-black/30 p-1.5 rounded border border-gray-800">
                            <span class="text-gray-300 text-[11px]">${t.time} - ${t.action} @ $${t.price}</span>
                            <span class="${t.pnl.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'} font-bold ltr text-[11px]">${t.pnl}</span>
                        </div>
                    `).join('');
                }

                // Logs
                const logDiv = document.getElementById('logConsole');
                logDiv.innerHTML = data.logs.map(l => `<div class="text-[11px]">${l}</div>`).join('');
                logDiv.scrollTop = logDiv.scrollHeight;

            } catch (err) {
                console.error("خطا در تلمتری:", err);
            }
        }

        async function sendAction(actionName) {
            try {
                await fetch('/api/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: actionName, symbol: 'BTCUSDT', amount: 0.02 })
                });
                fetchTelemetry();
            } catch (err) {
                console.error("خطا در ارسال دستور:", err);
            }
        }

        setInterval(fetchTelemetry, 2500);
        fetchTelemetry();
    </script>
</body>
</html>
